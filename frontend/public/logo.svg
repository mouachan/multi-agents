<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Agentic AI Platform">
  <title>Agentic AI Platform</title>
  <defs>
    <linearGradient id="aap-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="aap-core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <radialGradient id="aap-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- tile -->
  <rect width="64" height="64" rx="16" fill="url(#aap-bg)"/>
  <circle cx="32" cy="33" r="22" fill="url(#aap-glow)"/>
  <!-- orbit: A2A / MCP links between the domain agents -->
  <circle cx="32" cy="33" r="18" fill="none" stroke="#c7d2fe" stroke-width="1.5" stroke-dasharray="2.2 3.4" stroke-linecap="round" opacity="0.85"/>
  <!-- orchestrator to agents -->
  <g stroke="#e0e7ff" stroke-width="2.6" stroke-linecap="round">
    <line x1="32" y1="33" x2="32" y2="15"/>
    <line x1="32" y1="33" x2="47.6" y2="42"/>
    <line x1="32" y1="33" x2="16.4" y2="42"/>
  </g>
  <!-- domain agents: finance (top), BTP (right), logistics (left) -->
  <g fill="#ffffff">
    <circle cx="32" cy="15" r="5.4"/>
    <circle cx="47.6" cy="42" r="5.4"/>
    <circle cx="16.4" cy="42" r="5.4"/>
  </g>
  <circle cx="32" cy="15" r="2.6" fill="#10b981"/>    <!-- finance -->
  <circle cx="47.6" cy="42" r="2.6" fill="#f59e0b"/>  <!-- BTP -->
  <circle cx="16.4" cy="42" r="2.6" fill="#14b8a6"/>  <!-- logistics -->
  <!-- orchestrator core -->
  <path d="M32 24.6 L39.3 28.8 V37.2 L32 41.4 L24.7 37.2 V28.8 Z" fill="url(#aap-core)" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M32 29.4 L35.2 31.2 V34.8 L32 36.6 L28.8 34.8 V31.2 Z" fill="#4f46e5"/>
  <!-- Red Hat accent -->
  <circle cx="53" cy="11" r="3.4" fill="#ee0000" stroke="#ffffff" stroke-width="1.6"/>
</svg>
