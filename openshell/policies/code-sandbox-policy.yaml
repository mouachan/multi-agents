# OpenShell policy for the claims agent code interpreter (MCP tool run_python).
#
# - Network: no network_policies entry, so every outbound connection is denied
#   (OpenShell is default-deny: an empty map allows nothing).
# - Filesystem: Landlock, hard requirement (the sandbox does not start with a
#   partial ruleset). System directories are read-only; only /sandbox and /tmp
#   are writable. Anything else — including /var/run/secrets — is not readable.
# - Process: runs as the unprivileged "sandbox" user.
# Static fields (filesystem, landlock, process) are fixed at sandbox creation.
version: 1

filesystem_policy:
  include_workdir: false
  read_only:
    - /usr
    - /lib
    - /lib64
    - /etc
    - /proc
    - /dev/urandom
  read_write:
    - /sandbox
    - /tmp
    - /dev/null

landlock:
  compatibility: hard_requirement

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies: {}
