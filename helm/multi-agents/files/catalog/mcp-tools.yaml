# MCP tools published in the OpenShift AI catalog (AI hub > MCP servers): name, description,
# access type and parameters, as listed by each server (tools/list; the description is the first
# paragraph of the tool's docstring, the parameters come from its "Args:" section).
# accessType: read_only | read_write (writes to the database) | execute (runs code, in the OpenShell sandbox)

ocr:
- name: ocr_document
  description: 'Read the document of a claim, a tender or a postal complaint (OCR) and return its text. The text
    is kept: reading the same document again returns it at once.'
  accessType: read_write
  parameters:
  - name: document_id
    type: string
    description: The case number (e.g. CLM-2024-0024, AO-2026-IDF-001, RECL-2026-0001)
    required: true
  - name: refresh
    type: boolean
    description: true to read the document again even if it was already read
    required: false
rag:
- name: retrieve_user_info
  description: Get a claimant and their ACTIVE insurance contracts (type, coverage amount, key terms such as the
    franchise, contract text).
  accessType: read_only
  parameters:
  - name: user_id
    type: string
    description: The claimant's id (e.g. USR026) or a claim number (e.g. CLM-2024-0026)
    required: true
  - name: query
    type: string
    description: Optional text to rank the contracts by relevance (e.g. "water damage")
    required: false
  - name: top_k
    type: integer
    description: Maximum number of contracts (default 5)
    required: false
- name: retrieve_similar_claims
  description: Find decided claims similar to a claim (precedents), each with its decision, confidence and reasoning.
    With a claim number, the precedents are of the same claim type.
  accessType: read_only
  parameters:
  - name: claim_text
    type: string
    description: A claim number (e.g. CLM-2024-0026) or the text of a claim
    required: true
  - name: claim_type
    type: string
    description: Optional claim type filter (Auto, Home, Medical, Life)
    required: false
  - name: top_k
    type: integer
    description: Maximum number of precedents (default 10)
    required: false
  - name: min_similarity
    type: number
    description: Minimum similarity, 0.0 to 1.0 (default 0.5)
    required: false
- name: search_knowledge_base
  description: Search the insurance knowledge base (policies, coverage rules, procedures).
  accessType: read_only
  parameters:
  - name: query
    type: string
    description: What to search for
    required: true
  - name: top_k
    type: integer
    description: Maximum number of articles (default 5)
    required: false
  - name: category
    type: string
    description: Optional category filter
    required: false
- name: retrieve_similar_references
  description: 'Find the company''s past projects (references) similar to a tender: client, type of works, amount,
    region.'
  accessType: read_only
  parameters:
  - name: project_description
    type: string
    description: A tender number (e.g. AO-2026-IDF-001) or the description of the project
    required: true
  - name: top_k
    type: integer
    description: Maximum number of references (default 5)
    required: false
- name: retrieve_historical_tenders
  description: Find past tenders similar to a tender, won or lost, with the reason of the result, the technical
    and price marks, and the win rate among them.
  accessType: read_only
  parameters:
  - name: tender_description
    type: string
    description: A tender number (e.g. AO-2026-IDF-001) or the description of the tender
    required: true
  - name: top_k
    type: integer
    description: Maximum number of past tenders (default 5)
    required: false
- name: retrieve_capabilities
  description: 'Find the company''s capabilities matching a need: certifications, equipment, staff, with their validity,
    region and availability.'
  accessType: read_only
  parameters:
  - name: required_capabilities
    type: string
    description: A tender number (e.g. AO-2026-IDF-001) or the capabilities needed
    required: true
  - name: category
    type: string
    description: Optional category filter (certification, materiel, personnel)
    required: false
  - name: top_k
    type: integer
    description: Maximum number of capabilities (default 10)
    required: false
- name: search_courrier_knowledge
  description: 'Search the postal knowledge base: rates, delivery times, packaging, customs, refunds, rules.'
  accessType: read_only
  parameters:
  - name: query
    type: string
    description: What to search for (e.g. "tarif colissimo international")
    required: true
  - name: category
    type: string
    description: Optional category filter (tarifs, delais, emballage, douane, remboursement)
    required: false
  - name: limit
    type: integer
    description: Maximum number of articles (default 5)
    required: false
- name: retrieve_similar_reclamations
  description: Find past postal complaints similar to a complaint (precedents), with their decision.
  accessType: read_only
  parameters:
  - name: reclamation_text
    type: string
    description: A complaint number (e.g. RECL-2026-0001) or the text of a complaint
    required: true
  - name: limit
    type: integer
    description: Maximum number of precedents (default 5)
    required: false
claims:
- name: list_claims
  description: List insurance claims, the most recent first, with their current decision.
  accessType: read_only
  parameters:
  - name: status
    type: string
    description: Optional status filter (pending, processing, completed, denied, manual_review, failed)
    required: false
  - name: limit
    type: integer
    description: Maximum number of claims (default 10, at most 100)
    required: false
- name: get_claim
  description: 'Get a claim: number, type, status, dates, claimant, metadata, and its current decision. If has_document
    is true, ocr_document(document_id=<claim number>) reads its document.'
  accessType: read_only
  parameters:
  - name: claim_id
    type: string
    description: The claim number (e.g. CLM-2024-0001)
    required: true
- name: get_claim_documents
  description: Get the documents of a claim with the beginning of their OCR text (empty until ocr_document has read
    them).
  accessType: read_only
  parameters:
  - name: claim_id
    type: string
    description: The claim number (e.g. CLM-2024-0001)
    required: true
- name: get_claim_statistics
  description: 'Get statistics of the claims: count by status, processing times, current decisions.'
  accessType: read_only
  parameters: []
- name: compute_payout
  description: Compute the payout of a claim (coverage check and amount) in the OpenShell sandbox.
  accessType: read_only
  parameters:
  - name: claim_id
    type: string
    description: The claim number (e.g. CLM-2024-0001)
    required: true
tenders:
- name: list_tenders
  description: List tenders (appels d'offres), the most recent first, with their details and current decision.
  accessType: read_only
  parameters:
  - name: status
    type: string
    description: Optional status filter (pending, processing, completed, manual_review, declined, failed)
    required: false
  - name: limit
    type: integer
    description: Maximum number of tenders (default 10, at most 100)
    required: false
- name: get_tender
  description: 'Get a tender: number, type, status, dates, metadata (titre, maitre_ouvrage, montant_estime, region,
    lots, criteres_attribution, date_limite_remise...) and its current decision. If has_document is true, ocr_document(document_id=<tender
    number>) reads its document.'
  accessType: read_only
  parameters:
  - name: tender_id
    type: string
    description: The tender number (e.g. AO-2026-IDF-001)
    required: true
- name: get_tender_documents
  description: Get the documents of a tender with the beginning of their OCR text (empty until ocr_document has
    read them).
  accessType: read_only
  parameters:
  - name: tender_id
    type: string
    description: The tender number (e.g. AO-2026-IDF-001)
    required: true
- name: get_tender_statistics
  description: 'Get statistics of the tenders: count by status, processing times, current decisions.'
  accessType: read_only
  parameters: []
postal:
- name: list_reclamations
  description: List postal complaints, the most recent first, with their current decision.
  accessType: read_only
  parameters:
  - name: status
    type: string
    description: Optional status filter (pending, processing, completed, rejected, escalated, failed)
    required: false
  - name: limit
    type: integer
    description: Maximum number of complaints (default 10, at most 100)
    required: false
- name: get_reclamation
  description: 'Get a postal complaint: number, type, status, parcel tracking number, declared value, description,
    the latest tracking events of the parcel, and its current decision. If has_document is true, ocr_document(document_id=<complaint
    number>) reads its document.'
  accessType: read_only
  parameters:
  - name: reclamation_id
    type: string
    description: The complaint number (e.g. RECL-2026-0001)
    required: true
- name: get_reclamation_documents
  description: Get the documents of a postal complaint with the beginning of their OCR text (empty until ocr_document
    has read them).
  accessType: read_only
  parameters:
  - name: reclamation_id
    type: string
    description: The complaint number (e.g. RECL-2026-0001)
    required: true
- name: get_reclamation_statistics
  description: 'Get statistics of the postal complaints: count by status, processing times, current decisions.'
  accessType: read_only
  parameters: []
tracking:
- name: get_tracking
  description: 'Get the tracking timeline of a parcel: its events in chronological order, whether it was delivered,
    its last event, and the complaint about it if there is one.'
  accessType: read_only
  parameters:
  - name: numero_suivi
    type: string
    description: The parcel tracking number (e.g. 6C123456789FR)
    required: true
sandbox:
- name: run_python
  description: 'Execute Python code in an isolated OpenShell sandbox and return its output. Use it for exact computations
    (e.g. claim payout: amount minus deductible, capped by the policy limit). The sandbox has NO network access
    and can only write to /sandbox and /tmp; print() the results you need. Standard library and numpy are available.
    Write the code on one line, statements separated by "; " and strings in single quotes, e.g. "a=6200.0; b=350.0;
    print(''payout:'', a-b)".'
  accessType: execute
  parameters:
  - name: code
    type: string
    description: Python source code to run with python3.12
    required: true
  - name: timeout_s
    type: integer
    description: Maximum execution time in seconds (default 20)
    required: false
