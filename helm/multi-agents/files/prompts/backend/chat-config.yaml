# The chat's texts and suggestions (backend: app/services/chat/config.py). Edit and `helm upgrade`.
#
#   welcome_messages     first message of a new conversation, per language (orchestrator / with an agent)
#   language_detection   French words: a message with at least min_match_count of them is answered in French
#   suggested_actions    buttons proposed when a message is routed to an agent profile (or "general")
#   follow_up_actions    buttons proposed after an agent's answer: "common" always; "result_actions" when the
#                        answer contains one of "result_keywords"; "go_action" when it contains a "go_keywords"
#   tool_display         labels, short names and colors of the MCP tools and servers in the chat UI
welcome_messages:
  fr:
    orchestrator: Bienvenue ! Je suis l'orchestrateur multi-agents. Decrivez ce que vous souhaitez faire et je vous
      orienterai vers l'agent specialise.
    agent: Session demarree avec l'agent **{agent_name}**. Comment puis-je vous aider ?
    fallback: Session demarree.
  en:
    orchestrator: Welcome! I'm the multi-agent orchestrator. Describe what you'd like to do and I'll route you to
      the right specialized agent.
    agent: Session started with agent **{agent_name}**. How can I help you?
    fallback: Session started.
language_detection:
  fr_words:
  - afficher
  - appel
  - attente
  - avec
  - ce
  - cette
  - combien
  - dans
  - des
  - donc
  - du
  - elle
  - elles
  - est
  - et
  - il
  - ils
  - je
  - la
  - le
  - les
  - leur
  - leurs
  - lister
  - mais
  - mes
  - mon
  - nous
  - offres
  - ou
  - par
  - pour
  - que
  - qui
  - ses
  - sinistre
  - sinistres
  - son
  - sont
  - sur
  - tes
  - ton
  - traiter
  - tu
  - un
  - une
  - voir
  - vous
  min_match_count: 2
