{{- /*
Decoupled A2A domain agents (a2a-sdk, JSON-RPC binding on :8090).
One Deployment + Service + ServiceAccount per agent. Prompts are loaded from the
MLflow Prompt Registry (alias .Values.mlflow.prompts.alias), with the agent-prompts
ConfigMap mounted as fallback.
*/}}
{{- if .Values.agents.enabled }}
{{- $ns := include "multi-agents.namespace" . }}
{{- range $name := list "claims" "tenders" "postal" }}
{{- $agent := index $.Values.agents $name }}
{{- if $agent.enabled }}
{{- $app := printf "%s-agent" $name }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $app }}
  namespace: {{ $ns }}
  labels:
    {{- include "multi-agents.labels" $ | nindent 4 }}
    app: {{ $app }}
    component: a2a-agent
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $app }}
  namespace: {{ $ns }}
  labels:
    {{- include "multi-agents.labels" $ | nindent 4 }}
    app: {{ $app }}
    component: a2a-agent
spec:
  type: ClusterIP
  ports:
  - port: 8090
    targetPort: 8090
    protocol: TCP
    name: http
  selector:
    app: {{ $app }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $app }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    {{- include "multi-agents.labels" $ | nindent 4 }}
    app: {{ $app }}
    component: a2a-agent
    agent-domain: {{ $name }}
spec:
  replicas: {{ $agent.replicas }}
  selector:
    matchLabels:
      app: {{ $app }}
  template:
    metadata:
      labels:
        app: {{ $app }}
        component: a2a-agent
        agent-domain: {{ $name }}
      annotations:
        checksum/prompts: {{ $.Files.Glob "files/prompts/agents/*" | toString | sha256sum | trunc 16 }}
    spec:
      serviceAccountName: {{ $app }}
      containers:
      - name: agent
        image: {{ include "multi-agents.imageRegistry" $ }}/{{ $agent.image.repository }}:{{ $agent.image.tag }}
        imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
        ports:
        - containerPort: 8090
          name: http
          protocol: TCP
        env:
        - name: AGENT_ID
          value: {{ $name | quote }}
        - name: AGENT_PORT
          value: "8090"
        - name: AGENT_PUBLIC_URL
          value: {{ printf "http://%s.%s.svc.cluster.local:8090" $app $ns | quote }}
        - name: OGX_ENDPOINT
          value: {{ include "multi-agents.ogx.endpoint" $ | quote }}
        - name: OGX_DEFAULT_MODEL
          value: {{ include "multi-agents.ogx.chatModel" ($agent.model | default $.Values.models.reasoning) | quote }}
        {{- with $.Values.models.processing }}
        - name: OGX_PROCESS_MODEL
          value: {{ include "multi-agents.ogx.chatModel" . | quote }}
        {{- end }}
        - name: OGX_MAX_TOKENS
          value: {{ $.Values.agents.maxTokens | quote }}
        - name: OGX_TIMEOUT
          value: {{ $.Values.agents.timeout | quote }}
        {{- include "multi-agents.mcp.agentEnv" $ | nindent 8 }}
        {{- if $.Values.guardrails.enabled }}
        - name: GUARDRAILS_ENDPOINT
          value: {{ include "multi-agents.guardrails.endpoint" $ | quote }}
        - name: GUARDRAILS_CONFIG_ID
          value: {{ $.Values.guardrails.configId | quote }}
        - name: GUARDRAILS_FAIL_OPEN
          value: {{ $.Values.guardrails.failOpen | quote }}
        - name: GUARDRAILS_MODEL
          value: {{ $.Values.models.guardrails | quote }}
        {{- end }}
        {{- if $.Values.mlflow.enabled }}
        {{- /* same experiment as the backend: the agent spans join the backend traces (traceparent) */}}
        {{- include "multi-agents.mlflow.env" (dict "root" $ "experiment" $.Values.mlflow.experimentName) | nindent 8 }}
        {{- end }}
        {{- if $.Values.spiffe.enabled }}
        {{- include "multi-agents.spiffe.env" $ | nindent 8 }}
        - name: SPIFFE_ALLOWED_IDS
          value: {{ printf "/ns/%s/sa/backend" $ns | quote }}
        {{- end }}
        - name: PROMPTS_DIR
          value: /opt/app-root/prompts
        - name: LOG_LEVEL
          value: {{ $agent.logLevel | default "INFO" | quote }}
        volumeMounts:
        - name: prompts
          mountPath: /opt/app-root/prompts
        {{- include "multi-agents.spiffe.volumeMount" $ | nindent 8 }}
        resources:
          {{- toYaml $agent.resources | nindent 10 }}
        startupProbe:
          httpGet:
            path: /health
            port: 8090
          periodSeconds: 5
          failureThreshold: 24
        livenessProbe:
          httpGet:
            path: /health
            port: 8090
          periodSeconds: 20
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /.well-known/agent-card.json
            port: 8090
          periodSeconds: 10
          timeoutSeconds: 3
      volumes:
      - name: prompts
        configMap:
          name: agent-prompts
      {{- include "multi-agents.spiffe.volume" $ | nindent 6 }}
{{- end }}
{{- end }}
{{- end }}
