{{- if .Values.guardrails.enabled }}
---
apiVersion: trustyai.opendatahub.io/v1alpha1
kind: NemoGuardrails
metadata:
  name: {{ .Values.guardrails.name }}
  namespace: {{ include "multi-agents.namespace" . }}
  labels:
    {{- include "multi-agents.labels" . | nindent 4 }}
    app: claims-processing
    component: guardrails
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  replicas: {{ .Values.guardrails.replicas }}
  nemoConfigs:
    - name: claims-guardrails
      default: true
      configMaps:
        - nemo-guardrails-config
  env:
    - name: OPENAI_API_KEY
      valueFrom:
        secretKeyRef:
          name: litemaas-secret
          key: LITEMAAS_API_KEY
{{- end }}
