{{- if .Values.guardrails.enabled }}
---
apiVersion: trustyai.opendatahub.io/v1alpha1
kind: NemoGuardrails
metadata:
  name: {{ .Values.guardrails.name }}
  namespace: {{ include "multi-agents.namespace" . }}
  labels:
    {{- include "multi-agents.labels" . | nindent 4 }}
    component: guardrails
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  replicas: {{ .Values.guardrails.replicas }}
  nemoConfigs:
    - name: {{ .Values.guardrails.configId }}
      default: true
      configMaps:
        - {{ .Values.guardrails.name }}-config
  env:
    # Read by the main model through api_key_env_var (OPENAI_API_KEY alone is ignored)
    - name: MAAS_API_KEY
      valueFrom:
        secretKeyRef:
          name: {{ include "multi-agents.guardrails.llmKeySecret" . }}
          key: api-key
{{- end }}
