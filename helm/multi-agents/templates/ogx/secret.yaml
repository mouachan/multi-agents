{{- if .Values.secrets.create }}
{{- /*
MaaS credentials (key: api-key). Labels:
  ogx.io/watch                   OGX operator restarts the server when it changes
  inference.llm-d.ai/ipp-managed required for ExternalProvider credentials (RHOAI 3.5 MaaS)
*/}}
---
apiVersion: v1
kind: Secret
metadata:
  name: maas-external-credentials
  namespace: {{ include "multi-agents.namespace" . }}
  labels:
    {{- include "multi-agents.labels" . | nindent 4 }}
    ogx.io/watch: "true"
    inference.llm-d.ai/ipp-managed: "true"
type: Opaque
stringData:
  api-key: {{ .Values.secrets.maasExternalApiKey | quote }}
{{- if and .Values.models.maas.enabled .Values.secrets.maasApiKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: maas-api-key
  namespace: {{ include "multi-agents.namespace" . }}
  labels:
    {{- include "multi-agents.labels" . | nindent 4 }}
    ogx.io/watch: "true"
type: Opaque
stringData:
  api-key: {{ .Values.secrets.maasApiKey | quote }}
{{- end }}
{{- end }}
