{{- if .Values.ogx.enabled }}
{{- $ns := include "multi-agents.namespace" . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.ogx.name }}-config
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    {{- include "multi-agents.labels" . | nindent 4 }}
    ogx.io/watch: "true"
data:
  config.yaml: |
    # OGX 1.2 run configuration (RHOAI 3.5) — chat models through the cluster MaaS,
    # embeddings straight to the external MaaS (MaaS external models are chat-only).
    version: 2
    distro_name: rh
    apis:
    - inference
    - responses
    - vector_io
    - files
    - file_processors
    - tool_runtime

    providers:
      inference:
      - provider_id: maas
        provider_type: remote::vllm
        config:
          base_url: {{ include "multi-agents.maas.chatUrl" . | quote }}
          api_token: ${env.MAAS_API_KEY}
          # 0 = no default: OGX would otherwise add max_tokens next to the
          # max_completion_tokens derived from the agents' max_output_tokens, and the
          # MaaS backend rejects requests carrying both. Per-call limit: agents.maxTokens.
          max_tokens: 0
          tls_verify: {{ if .Values.models.maas.enabled }}{{ .Values.models.maas.tlsVerify }}{{ else }}true{{ end }}
      - provider_id: maas-direct
        provider_type: remote::vllm
        config:
          base_url: {{ include "multi-agents.maas.externalUrl" . | quote }}
          api_token: ${env.MAAS_EXTERNAL_API_KEY}
          max_tokens: 512
          tls_verify: true

      vector_io:
      - provider_id: pgvector
        provider_type: remote::pgvector
        config:
          host: ${env.POSTGRES_HOST}
          port: ${env.POSTGRES_PORT:=5432}
          db: ${env.POSTGRES_DB}
          user: ${env.POSTGRES_USER}
          password: ${env.POSTGRES_PASSWORD}
          distance_metric: COSINE
          persistence:
            backend: kv_default
            namespace: vector_io::pgvector

      responses:
      - provider_id: builtin
        provider_type: inline::builtin
        config:
          persistence:
            responses:
              backend: sql_default
              table_name: responses
              max_write_queue_size: 10000
              num_writers: 4

      files:
{{- if .Values.minio.enabled }}
      - provider_id: s3-files
        provider_type: remote::s3
        config:
          bucket_name: {{ .Values.minio.documentBuckets.claims }}
          region: us-east-1
          endpoint_url: http://{{ include "multi-agents.fullname" . }}-minio.{{ $ns }}.svc.cluster.local:{{ .Values.minio.service.apiPort }}
          aws_access_key_id: ${env.AWS_ACCESS_KEY_ID}
          aws_secret_access_key: ${env.AWS_SECRET_ACCESS_KEY}
          metadata_store:
            backend: sql_default
            table_name: files_metadata
{{- else }}
      - provider_id: localfs-files
        provider_type: inline::localfs
        config:
          storage_dir: /opt/app-root/src/.ogx/files
          metadata_store:
            backend: sql_default
            table_name: files_metadata
{{- end }}

      file_processors:
      - provider_id: pypdf
        provider_type: inline::pypdf
        config: {}

      tool_runtime:
      - provider_id: file-search
        provider_type: inline::file-search
        config: {}
      - provider_id: model-context-protocol
        provider_type: remote::model-context-protocol
        config: {}

    storage:
      backends:
        kv_default:
          type: kv_postgres
          host: ${env.POSTGRES_HOST}
          port: ${env.POSTGRES_PORT:=5432}
          db: ${env.POSTGRES_DB}
          user: ${env.POSTGRES_USER}
          password: ${env.POSTGRES_PASSWORD}
          table_name: ogx_kvstore
        sql_default:
          type: sql_postgres
          host: ${env.POSTGRES_HOST}
          port: ${env.POSTGRES_PORT:=5432}
          db: ${env.POSTGRES_DB}
          user: ${env.POSTGRES_USER}
          password: ${env.POSTGRES_PASSWORD}
      stores:
        metadata:
          backend: kv_default
          namespace: registry
        inference:
          backend: sql_default
          table_name: inference_store
          max_write_queue_size: 10000
          num_writers: 4
        conversations:
          backend: sql_default
          table_name: openai_conversations
        prompts:
          backend: sql_default
          table_name: prompts
        connectors:
          backend: sql_default
          table_name: connectors

    vector_stores:
      default_provider_id: pgvector
      default_embedding_model:
        provider_id: maas-direct
        model_id: {{ .Values.models.embedding }}
      file_ingestion_params:
        default_chunk_size_tokens: 512
        default_chunk_overlap_tokens: 128

    registered_resources:
      models:
{{- range $m := (list .Values.models.reasoning .Values.models.vision .Values.models.guardrails | uniq) }}
      - provider_id: maas
        model_id: {{ $m }}
        provider_model_id: {{ $m }}
        model_type: llm
        metadata:
          display_name: {{ $m }}
{{- end }}
      - provider_id: maas-direct
        model_id: {{ .Values.models.embedding }}
        provider_model_id: {{ .Values.models.embedding }}
        model_type: embedding
        metadata:
          embedding_dimension: {{ .Values.models.embeddingDimension }}
      vector_stores: []

    server:
      port: 8321
{{- end }}
