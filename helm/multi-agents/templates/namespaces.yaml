{{- /*
The release namespace is created by `helm install --create-namespace` (Helm stores the
release there) and labelled by the post-install namespace-labels job; it is only
templated when the chart targets another namespace than the release one.
*/}}
{{- if ne (include "multi-agents.namespace" .) .Release.Namespace }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "multi-agents.namespace" . }}
  labels:
    {{- include "multi-agents.labels" . | nindent 4 }}
    opendatahub.io/dashboard: "true"
  annotations:
    # Helm hooks
    # pre-install only, never deleted by Helm: a pre-upgrade hook with
    # before-hook-creation would delete the namespace (and the release) on upgrade
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-100"
    # ArgoCD GitOps
    "argocd.argoproj.io/sync-wave": "-100"
{{- end }}
