{{- if .Values.mcpGateway.enabled }}
{{- /*
One MCPGatewayExtension per namespace. The mcp-gateway controller (mcp-system) deploys the
broker/router ("mcp-gateway" Deployment + Service :8080/:50051) in this namespace, creates the
"mcp-gateway-route" HTTPRoute on the "mcp" listener and the ext_proc EnvoyFilter.
privateHost = Service generated by the Gateway API controller (<gateway>-<gatewayClass>),
used by the broker to hair-pin tool calls back through the gateway.
*/}}
---
apiVersion: mcp.kuadrant.io/v1alpha1
kind: MCPGatewayExtension
metadata:
  name: {{ .Values.mcpGateway.extension.name }}
  namespace: {{ include "multi-agents.namespace" . }}
  labels:
    {{- include "multi-agents.labels" . | nindent 4 }}
    app: mcp-gateway
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ .Values.mcpGateway.gatewayName }}
    namespace: {{ include "multi-agents.namespace" . }}
    sectionName: mcp
  privateHost: {{ printf "%s:%v" (include "multi-agents.mcpGateway.serviceHost" .) .Values.mcpGateway.listenerPort | quote }}
  httpRouteManagement: {{ .Values.mcpGateway.httpRouteManagement }}
  {{- with .Values.mcpGateway.backendPingIntervalSeconds }}
  backendPingIntervalSeconds: {{ . }}
  {{- end }}
{{- end }}
