{{- /*
Mints the cluster MaaS API key (sk-oai-..., bound to the namespace subscription) with
the Job's ServiceAccount token, and stores it in Secret maas-api-key (key: api-key).
Skipped when secrets.maasApiKey is provided or the Secret already holds a key.
*/}}
{{- if and .Values.models.maas.enabled (not .Values.secrets.maasApiKey) }}
{{- $ns := include "multi-agents.namespace" . }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maas-key-minter
  namespace: {{ $ns }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: maas-key-minter
  namespace: {{ $ns }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
- apiGroups: [""]
  resources: [secrets]
  verbs: [get, create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: maas-key-minter
  namespace: {{ $ns }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: maas-key-minter
subjects:
- kind: ServiceAccount
  name: maas-key-minter
  namespace: {{ $ns }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: maas-api-key
  namespace: {{ $ns }}
  labels:
    {{- include "multi-agents.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: maas-key-minter
      containers:
      - name: mint
        image: registry.redhat.io/openshift4/ose-cli:latest
        env:
        - name: MAAS_API
          value: {{ printf "%s/maas-api/v1/api-keys" (trimSuffix "/v1" (include "multi-agents.maas.gatewayUrl" .)) | quote }}
        - name: SUBSCRIPTION
          value: {{ .Values.models.maas.subscriptionName | quote }}
        - name: EXPIRES_IN
          value: {{ .Values.models.maas.keyExpiration | quote }}
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          if oc get secret maas-api-key -o jsonpath='{.data.api-key}' 2>/dev/null | grep -q .; then
            echo "Secret maas-api-key already holds a key — nothing to do"; exit 0
          fi
          TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          echo "Requesting a MaaS API key for subscription ${SUBSCRIPTION} ..."
          # Status checked explicitly: the ose-cli curl predates --fail-with-body
          RESP=$(curl -sk -w '\n%{http_code}' -X POST "${MAAS_API}" \
            -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" \
            -d "{\"name\":\"{{ $ns }}-ogx\",\"expiresIn\":\"${EXPIRES_IN}\",\"subscription\":\"${SUBSCRIPTION}\"}")
          CODE=$(echo "${RESP}" | tail -n1)
          BODY=$(echo "${RESP}" | sed '$d')
          case "${CODE}" in 2??) ;; *) echo "maas-api returned HTTP ${CODE}: ${BODY}"; exit 1 ;; esac
          KEY=$(echo "${BODY}" | tr -d '\n' | sed -n 's/.*"key"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
          [ -n "${KEY}" ] || { echo "No key in maas-api response"; exit 1; }
          oc create secret generic maas-api-key --from-literal=api-key="${KEY}" --dry-run=client -o yaml \
            | oc label --local -f - ogx.io/watch=true -o yaml | oc apply -f -
          echo "Secret maas-api-key created"
{{- end }}
