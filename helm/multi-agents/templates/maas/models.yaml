{{- /*
RHOAI 3.5 Models-as-a-Service — external models published through the cluster MaaS
gateway (token rate limiting, metering, API keys bound to a subscription).
  ExternalProvider -> ExternalModel (inference.opendatahub.io) -> MaaSModelRef (maas.opendatahub.io)
  MaaSSubscription + MaaSAuthPolicy for the namespace ServiceAccounts group.
With authentication, the access profiles get the models too, and each profile with a tokenQuota its
own MaaSSubscription: the agents call the models as the user (models.maas.callAsUser), so the MaaS
counts and limits each member of the profile (429 beyond the quota).
External models are Technology Preview in RHOAI 3.5 and chat-only (no embeddings).
*/}}
{{- if .Values.models.maas.enabled }}
{{- $ns := include "multi-agents.namespace" . }}
---
apiVersion: inference.opendatahub.io/v1alpha1
kind: ExternalProvider
metadata:
  name: external-maas
  namespace: {{ $ns }}
  labels:
    {{- include "multi-agents.labels" . | nindent 4 }}
spec:
  provider: openai
  endpoint: {{ .Values.models.external.host | quote }}
  auth:
    type: apikey
    secretRef:
      name: maas-external-credentials
{{- range $m := .Values.models.maas.chatModels }}
---
apiVersion: inference.opendatahub.io/v1alpha1
kind: ExternalModel
metadata:
  name: {{ $m }}
  namespace: {{ $ns }}
  labels:
    {{- include "multi-agents.labels" $ | nindent 4 }}
spec:
  externalProviderRefs:
  - ref:
      name: external-maas
    targetModel: {{ $m }}
    apiFormat: openai-chat
    path: /v1/chat/completions
    weight: 100
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: {{ $m }}
  namespace: {{ $ns }}
  labels:
    {{- include "multi-agents.labels" $ | nindent 4 }}
  {{- with (index ($.Values.models.maas.modelInfo | default dict) $m) }}
  # Shown by OpenShift AI (AI asset endpoints, Gen AI playground) through maas-api
  annotations:
    openshift.io/display-name: {{ .displayName | quote }}
    openshift.io/description: {{ .description | quote }}
    opendatahub.io/genai-use-case: {{ .useCase | quote }}
  {{- end }}
spec:
  modelRef:
    kind: ExternalModel
    name: {{ $m }}
{{- end }}
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: {{ .Values.models.maas.subscriptionName }}
  namespace: {{ .Values.models.maas.namespace }}
  labels:
    {{- include "multi-agents.labels" . | nindent 4 }}
spec:
  priority: {{ .Values.models.maas.priority }}
  owner:
    groups:
    - name: system:serviceaccounts:{{ $ns }}
  modelRefs:
{{- range $m := .Values.models.maas.chatModels }}
  - name: {{ $m }}
    namespace: {{ $ns }}
    tokenRateLimits:
    - limit: {{ $.Values.models.maas.tokenRateLimit.limit | int64 }}
      window: {{ $.Values.models.maas.tokenRateLimit.window }}
{{- end }}
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: {{ .Values.models.maas.subscriptionName }}
  namespace: {{ .Values.models.maas.namespace }}
  labels:
    {{- include "multi-agents.labels" . | nindent 4 }}
spec:
  modelRefs:
{{- range $m := .Values.models.maas.chatModels }}
  - name: {{ $m }}
    namespace: {{ $ns }}
{{- end }}
  subjects:
    groups:
    - name: system:serviceaccounts:{{ $ns }}
{{- with .Values.models.maas.userAccess }}
{{- if .enabled }}
{{- /* with authentication, the models are granted to the access profiles */}}
{{- $groups := .groups }}
{{- if $.Values.auth.enabled }}
{{- $groups = list }}
{{- range $.Values.auth.profiles }}{{ $groups = append $groups .group }}{{ end }}
{{- end }}
---
# Cluster users: the same models in OpenShift AI (AI asset endpoints, Gen AI playground)
# with their own MaaS keys and token counter. Lower priority than the application
# subscription, whose API key is bound to it explicitly.
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: {{ $.Values.models.maas.subscriptionName }}-users
  namespace: {{ $.Values.models.maas.namespace }}
  labels:
    {{- include "multi-agents.labels" $ | nindent 4 }}
spec:
  priority: {{ .priority }}
  owner:
    groups:
    {{- range $groups }}
    - name: {{ . }}
    {{- end }}
  modelRefs:
{{- range $m := $.Values.models.maas.chatModels }}
  - name: {{ $m }}
    namespace: {{ $ns }}
    tokenRateLimits:
    - limit: {{ $.Values.models.maas.userAccess.tokenRateLimit.limit | int64 }}
      window: {{ $.Values.models.maas.userAccess.tokenRateLimit.window }}
{{- end }}
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: {{ $.Values.models.maas.subscriptionName }}-users
  namespace: {{ $.Values.models.maas.namespace }}
  labels:
    {{- include "multi-agents.labels" $ | nindent 4 }}
spec:
  modelRefs:
{{- range $m := $.Values.models.maas.chatModels }}
  - name: {{ $m }}
    namespace: {{ $ns }}
{{- end }}
  subjects:
    groups:
    {{- range $groups }}
    - name: {{ . }}
    {{- end }}
{{- if $.Values.auth.enabled }}
{{- range $id, $profile := $.Values.auth.profiles }}
{{- with $profile.tokenQuota }}
---
# Token quota of each member of the "{{ $profile.displayName }}" profile (one counter per user)
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: {{ $.Values.models.maas.subscriptionName }}-{{ $id }}
  namespace: {{ $.Values.models.maas.namespace }}
  labels:
    {{- include "multi-agents.labels" $ | nindent 4 }}
spec:
  priority: {{ .priority }}
  owner:
    groups:
    - name: {{ $profile.group }}
  modelRefs:
{{- range $m := $.Values.models.maas.chatModels }}
  - name: {{ $m }}
    namespace: {{ $ns }}
    tokenRateLimits:
    - limit: {{ $profile.tokenQuota.limit | int64 }}
      window: {{ $profile.tokenQuota.window }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
