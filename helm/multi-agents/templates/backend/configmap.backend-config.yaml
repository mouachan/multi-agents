{{- if .Values.backend.enabled }}
{{- $ns := include "multi-agents.namespace" . }}
---
# Backend settings (backend/app/core/config.py): one entry per setting, same name in upper case
apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "4" # after OGXServer
  name: backend-config
  namespace: {{ $ns }}
  labels:
    {{- include "multi-agents.labels" . | nindent 4 }}
    app: backend
data:
  APP_NAME: {{ .Values.backend.env.APP_NAME | quote }}
  APP_VERSION: {{ quote .Chart.AppVersion }}
  ENVIRONMENT: {{ .Values.backend.env.ENVIRONMENT | quote }}
  DEBUG: {{ .Values.backend.env.DEBUG | quote }}
  LOG_LEVEL: {{ .Values.backend.env.LOG_LEVEL | quote }}

  # OGX: case documents (Files API), embeddings of the processed cases, chat routing tie-break
  OGX_ENDPOINT: {{ quote (include "multi-agents.ogx.endpoint" .) }}
  OGX_DEFAULT_MODEL: {{ include "multi-agents.ogx.chatModel" .Values.models.reasoning | quote }}
  OGX_EMBEDDING_MODEL: {{ include "multi-agents.ogx.embeddingModel" . | quote }}

  # A2A agents, one per domain (app/agents.py)
  AGENT_TIMEOUT: "300"
{{- if .Values.agents.enabled }}
{{- range $name := list "claims" "tenders" "postal" }}
{{- if (index $.Values.agents $name).enabled }}
  {{ upper $name }}_AGENT_A2A_URL: "http://{{ $name }}-agent.{{ $ns }}.svc.cluster.local:8090"
{{- end }}
{{- end }}
{{- end }}

  # Prompt files of the backend (files/prompts/backend, ConfigMap backend-prompts)
  PROMPTS_DIR: /app/prompts
  CHAT_CONFIG_FILE: /app/prompts/chat-config.yaml

  # Authentication: OpenShift token + RBAC access profiles (templates/auth)
  AUTH_ENABLED: {{ .Values.auth.enabled | quote }}
  AUTH_NAMESPACE: {{ $ns | quote }}
  AUTH_PROFILES: {{ .Values.auth.profiles | toJson | quote }}
  AUTH_AGENT_TOOLS: {{ .Values.auth.agentTools | toJson | quote }}

  # Demo reset (admin page): the database seed and the precedent decisions of the installation
  SEED_DATA_FILE: /app/seed/seed.sql
  PRECEDENTS_FILE: /app/seed/precedent_decisions.json
{{- if .Values.mcp.sandbox.enabled }}

  # OpenShell sandbox page
  SANDBOX_SERVER_URL: "http://sandbox-server.{{ $ns }}.svc.cluster.local:8080"
{{- end }}
{{- if .Values.guardrails.enabled }}

  # NeMo Guardrails: chat answers and the personal data report of the claims
  GUARDRAILS_SERVER_URL: {{ include "multi-agents.guardrails.endpoint" . | quote }}
  GUARDRAILS_CONFIG_ID: {{ .Values.guardrails.configId | quote }}
  GUARDRAILS_MODEL_NAME: {{ .Values.models.guardrails | quote }}
{{- end }}
{{- if .Values.mlflow.enabled }}

  # MLflow: one trace per chat turn or processing
  MLFLOW_TRACKING_URI: {{ .Values.mlflow.trackingUri | quote }}
  MLFLOW_EXPERIMENT_NAME: {{ .Values.mlflow.experimentName | quote }}
  MLFLOW_UI_URL: {{ .Values.mlflow.uiUrl | default (printf "https://rh-ai.%s/mlflow" (include "multi-agents.clusterDomain" .)) | quote }}
  MLFLOW_RHOAI_WORKSPACE: {{ include "multi-agents.mlflow.workspace" . | quote }}
{{- end }}
{{- end }}
