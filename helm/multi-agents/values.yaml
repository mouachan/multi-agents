---
# =============================================================================
# Global Configuration
# =============================================================================
global:
  # OpenShift cluster domain (replace with your cluster domain)
  clusterDomain: "apps.cluster-xxxxx.xxxxx.sandboxYYYY.opentlc.com"  # Replace with your cluster domain

  # Namespace where all resources will be deployed
  namespace: multi-agents

  # Image registry for custom images
  imageRegistry: quay.io/mouachan/multi-agents

  # Image pull policy
  imagePullPolicy: IfNotPresent

  proxies:
    HTTP_PROXY: ""
    NO_PROXY: .svc,.local,127.0.0.1

# =============================================================================
# PostgreSQL Database
# =============================================================================
postgresql:
  enabled: true

  replicas: 1

  # Authentication
  auth:
    username: multi_agent_user
    database: multi_agent_db
    existingSecret: postgresql-secret
    secretKeys:
      userPasswordKey: POSTGRES_PASSWORD
      userNameKey: POSTGRES_USER
      databaseKey: POSTGRES_DATABASE

  # Storage
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""

  # Resources
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi

  # Image
  image:
    repository: docker.io/pgvector/pgvector
    tag: pg15

# =============================================================================
# Models — Red Hat OpenShift AI 3.5 Models-as-a-Service (no on-cluster GPU)
# =============================================================================
models:
  reasoning: llama-scout-17b       # agents (tool calling, reasoning)
  # Optional model for batch processing (claims/tenders/complaints); empty = reasoning.
  # On an OGX failure the agents retry once with the other model.
  processing: ""                # same as reasoning (gpt-oss-120b failed multi-step tool calling on the external MaaS)
  vision: llama-scout-17b          # OCR (multimodal)
  guardrails: llama-scout-17b      # NeMo LLM-based rails (fast)
  embedding: nomic-embed-text-v1-5
  embeddingDimension: 768

  # External OpenAI-compatible MaaS that actually serves the models
  external:
    host: "REPLACE_WITH_EXTERNAL_MAAS_HOST"   # FQDN only, e.g. maas.example.com
    # API key: --set secrets.maasExternalApiKey=... (never commit it)

  # Cluster MaaS (RHOAI 3.5): ExternalProvider + ExternalModel + MaaSModelRef +
  # MaaSSubscription/MaaSAuthPolicy — token rate limiting and metering per tenant.
  # When disabled, OGX calls the external MaaS directly.
  maas:
    enabled: true
    gatewayUrl: ""                    # default https://maas.<clusterDomain>/v1
    tlsVerify: false                  # MaaS gateway route certificate (self-signed on lab clusters)
    namespace: models-as-a-service    # where MaaSSubscription / MaaSAuthPolicy live
    subscriptionName: multi-agents
    priority: 10
    # One counter for the whole release (backend, agents, NeMo share the key). A guided
    # business processing uses ~20-30k tokens, a chat answer ~3-8k: 3M/h is about 100
    # processings an hour. Above it the gateway answers 429 (Too Many Requests).
    tokenRateLimit:
      limit: 3000000
      window: 1h
    # Cluster users (OpenShift groups) allowed to use these models from OpenShift AI: they
    # appear in the AI asset endpoints and the Gen AI playground. One counter per user.
    userAccess:
      enabled: true
      groups: [system:authenticated]
      priority: 5
      tokenRateLimit:
        limit: 200000
        window: 1h
    # MaaS API key (sk-oai-...) used by OGX and NeMo. Leave empty to let the
    # maas-api-key Job mint one with its ServiceAccount token (expires: keyExpiration).
    keyExpiration: 90d
    # Chat models routed through the cluster MaaS (embeddings are not supported by
    # MaaS external models: OGX calls the external MaaS directly for them)
    chatModels:
      - gpt-oss-120b
      - llama-scout-17b
    # Display information of the chat models in OpenShift AI (AI asset endpoints, playground)
    modelInfo:
      gpt-oss-120b:
        displayName: GPT-OSS 120B
        description: OpenAI open-weight reasoning model, served by the external MaaS through the cluster MaaS gateway.
        useCase: Reasoning, chat
      llama-scout-17b:
        displayName: Llama 4 Scout 17B
        description: Meta Llama 4 Scout (16 experts) used by the multi-agents platform for chat, tool calling, document OCR (vision) and the guardrails self-check.
        useCase: Agents, tool calling, vision, guardrails

# =============================================================================
# OGX (formerly LlamaStack) — RHOAI 3.5 OGXServer
# =============================================================================
ogx:
  enabled: true
  name: ogx                       # Service: <name>-service:8321
  distribution: rh                # rh | rh-dev
  database:
    name: ogx
    user: ogx
  # Files API storage: MinIO (S3) when minio.enabled, local PVC otherwise
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: 2000m
      memory: 4Gi

# =============================================================================
# MCP Servers
# =============================================================================
mcp:
  # Deploy MCP servers as MCPServer CRs (RHOAI MCP lifecycle operator, mcp.x-k8s.io/v1alpha1).
  # false = plain Deployment + Service. Either way each server is reachable in-cluster at
  # http://<key>-server.<namespace>.svc.cluster.local:8080/mcp (Streamable HTTP; /sse kept for legacy).
  # Note: MCPServer has no imagePullPolicy — bump image tags (or use digests) on rebuilds.
  useMCPServerCR: true

  # OGX settings injected into every MCP server (OGX_* env vars; model names come from `models:`)
  ogx:
    endpoint: ""                       # empty = chart OGX service (multi-agents.ogx.endpoint helper)
    timeout: 30

  # OCR Server (vision model via OGX /v1/chat/completions, PDF -> images)
  ocr:
    enabled: true
    replicas: 1
    image:
      repository: ocr-server
      tag: v3.5.2
    service:
      type: ClusterIP
      port: 8080
    serviceAccountName: ""
    env:
      LOG_LEVEL: "INFO"
      VISION_MAX_TOKENS: "2048"
      MAX_PDF_PAGES: "50"
      PDF_DPI: "200"
      # base64 page image cap: the cluster MaaS gateway hangs on vision requests above ~90 KB
      OCR_MAX_IMAGE_B64_KB: "60"
    probe:
      livenessInitialDelaySeconds: 30
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi

  # RAG Server (pgvector retrieval, OGX embeddings)
  rag:
    enabled: true
    replicas: 1
    image:
      repository: rag-server
      tag: v3.5.1
    service:
      type: ClusterIP
      port: 8080
    serviceAccountName: ""
    env:
      LOG_LEVEL: "INFO"
    resources:
      requests:
        cpu: 1000m
        memory: 6Gi
      limits:
        cpu: 2000m
        memory: 6Gi

  # Claims Server
  claims:
    enabled: true
    replicas: 1
    image:
      repository: claims-server
      tag: v3.5.3
    service:
      type: ClusterIP
      port: 8080
    serviceAccountName: ""
    env:
      LOG_LEVEL: "INFO"
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi

  # Tenders Server
  tenders:
    enabled: true
    replicas: 1
    image:
      repository: tenders-server
      tag: v3.5
    service:
      type: ClusterIP
      port: 8080
    serviceAccountName: ""
    env:
      LOG_LEVEL: "INFO"
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi

  # Postal Server (Courrier & Colis)
  postal:
    enabled: true
    replicas: 1
    image:
      repository: postal-server
      tag: v3.5
    service:
      type: ClusterIP
      port: 8080
    serviceAccountName: ""
    env:
      LOG_LEVEL: "INFO"
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi

  # Tracking Server
  tracking:
    enabled: true
    replicas: 1
    image:
      repository: tracking-server
      tag: v3.5
    service:
      type: ClusterIP
      port: 8080
    serviceAccountName: ""
    env:
      LOG_LEVEL: "INFO"
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi

  # Code interpreter: run_python executes LLM-generated code in an OpenShell sandbox
  # (NVIDIA OpenShell, Developer Preview in RHOAI 3.5 — see openshell/README.md).
  # Prerequisites: Agent Sandbox operator + OpenShell gateway in namespace "openshell",
  # and the gateway mTLS client bundle copied as Secret <openshell.clientTlsSecret> here.
  sandbox:
    enabled: false
    replicas: 1
    image:
      repository: sandbox-exec-server
      tag: v3.5.5
    service:
      type: ClusterIP
      port: 8080
    serviceAccountName: ""
    env:
      LOG_LEVEL: "INFO"
      OPENSHELL_ENDPOINT: "openshell.openshell.svc:8080"
      OPENSHELL_WORKSPACE: "default"
      OPENSHELL_TLS_DIR: "/etc/openshell/mtls"
      SANDBOX_POLICY_FILE: "/etc/openshell/policy/code-sandbox-policy.yaml"
      SANDBOX_IMAGE: "quay.io/mouachan/multi-agents/code-sandbox:v3.5"
    storage:
      - path: /etc/openshell/mtls
        source:
          type: Secret
          secret:
            secretName: openshell-client-tls
      - path: /etc/openshell/policy
        source:
          type: ConfigMap
          configMap:
            name: sandbox-exec-policy
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

# =============================================================================
# Backend API
# =============================================================================
backend:
  enabled: true

  replicas: 1

  # Image
  image:
    repository: backend
    tag: v3.5.17

  # Service
  service:
    type: ClusterIP
    port: 8000

  # Route (OpenShift)
  route:
    enabled: true
    host: ""  # Auto-generated if empty
    tls:
      enabled: true  # Enable TLS edge termination

  # Environment variables
  env:
    APP_NAME: "Claims Processing Demo"
    ENVIRONMENT: "production"
    DEBUG: "false"
    LOG_LEVEL: "INFO"

  # Resources
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# =============================================================================
# Frontend
# =============================================================================
frontend:
  enabled: true

  # Deployment
  replicas: 2

  # Image
  image:
    repository: frontend
    tag: v3.5.11

  # Service
  service:
    type: ClusterIP
    port: 8080

  # Route (OpenShift)
  route:
    enabled: true
    host: ""  # Auto-generated if empty
    tls:
      enabled: true  # Enable TLS edge termination

  # Resources
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# =============================================================================
# Secrets
# =============================================================================
secrets:
  # PostgreSQL passwords
  postgresPassword: "REPLACE_WITH_PASSWORD"
  postgresAdminPassword: "REPLACE_WITH_ADMIN_PASSWORD"
  ogxDbPassword: "REPLACE_WITH_OGX_DB_PASSWORD"

  # External MaaS API key (ExternalProvider credential + embeddings)
  maasExternalApiKey: "REPLACE_WITH_KEY"
  # Cluster MaaS API key (sk-oai-...). Empty = minted by the maas-api-key Job.
  maasApiKey: ""

  # Create secrets automatically
  create: true

# =============================================================================
# MinIO (S3-compatible object storage)
# =============================================================================
minio:
  enabled: true

  # Image configuration
  # MinIO community images are no longer published (quay.io/minio and Docker Hub
  # removed in 2026): Chainguard rebuild, "-dev" variant for the bash entrypoint.
  image:
    repository: cgr.dev/chainguard/minio
    tag: "latest-dev@sha256:12706237289ea1df7cf41e84af3251ada57a036838c9b62e7c9a8a76d0092ba5"

  # Root credentials
  rootUser: "admin"
  rootPassword: "REPLACE_WITH_MINIO_PASSWORD"

  # Service configuration
  service:
    type: ClusterIP
    apiPort: 9000
    consolePort: 9001

  # Route configuration
  route:
    api:
      enabled: true
      host: ""
      tls:
        enabled: true
    console:
      enabled: true
      host: ""
      tls:
        enabled: true

  # Document storage buckets (S3-compatible, used by LlamaStack Files API)
  documentBuckets:
    claims: claims
    tenders: tenders

  # Persistence
  persistence:
    enabled: true
    size: 20Gi
    accessMode: ReadWriteOnce
    storageClass: ""

  # Resources
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

# =============================================================================
# Authentication and access profiles
# Users log in with OpenShift OAuth (oauth-proxy in front of the UI). A profile is an
# OpenShift group; what it may use is OpenShift RBAC, one Role per agent:
#   - verb "use" on services/<agent>-agent: chat and business pages of that agent (backend
#     SubjectAccessReview)
#   - verb "call" on tools.mcp.multi-agents.io/<tool>: MCP tools, checked by the MCP Gateway
#     AuthPolicy (Authorino SubjectAccessReview) on every tools/call, with the end user's token
# Models: the users' MaaS subscription is granted to the profile groups.
# =============================================================================
auth:
  enabled: false
  profiles:
    admin:
      group: multi-agents-admins
      displayName: Administration
      agents: [claims, tenders, postal]
      admin: true            # demo reset, every agent
      users: []              # e.g. --set-json 'auth.profiles.admin.users=["alice"]'
    finance:
      group: multi-agents-finance
      displayName: Finance
      agents: [claims]
      users: []
    btp:
      group: multi-agents-btp
      displayName: BTP
      agents: [tenders]
      users: []
    logistics:
      group: multi-agents-logistics
      displayName: Logistique
      agents: [postal]
      users: []
  # MCP tools of each agent (granted with the agent, verb "call")
  agentTools:
    claims: [list_claims, get_claim, get_claim_documents, get_claim_statistics, compute_payout,
             ocr_document, retrieve_user_info, retrieve_similar_claims, search_knowledge_base, run_python]
    tenders: [list_tenders, get_tender, get_tender_documents, get_tender_statistics,
              ocr_document, retrieve_similar_references, retrieve_historical_tenders, retrieve_capabilities,
              search_knowledge_base]
    postal: [list_reclamations, get_reclamation, get_reclamation_documents, get_reclamation_statistics,
             get_tracking, search_courrier_knowledge,
             retrieve_similar_reclamations, ocr_document]
  oauthProxy:
    image: image-registry.openshift-image-registry.svc:5000/openshift/oauth-proxy:v4.4

# =============================================================================
# Hibernation: CronJobs scaling the Helm-managed workloads (backend, frontend,
# agents, PostgreSQL, MinIO) to zero at night and back up in the morning.
# Operator-managed workloads stay up. Schedules are in the cluster time zone (UTC).
# =============================================================================
hibernate:
  enabled: false
  image: registry.redhat.io/openshift4/ose-cli:latest
  shutdownSchedule: "0 19 * * *"
  wakeupSchedule: "0 13 * * *"
  wakeupSuspended: true

# =============================================================================
# Data Initialization (post-install job)
# =============================================================================
dataInit:
  enabled: true
  image:
    repository: data-init
    tag: v3.5.3
  documentsArchiveUrl: "https://github.com/mouachan/multi-agents/archive/refs/heads/main.tar.gz"
  forceReinit: "false"
  backoffLimit: 6
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 3600
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

# =============================================================================
# MLflow Tracing (RHOAI)
# =============================================================================
mlflow:
  enabled: true
  # RHOAI 3.5 MLflow (operator-managed, Kubernetes auth, workspaces = namespaces)
  trackingUri: "https://mlflow.redhat-ods-applications.svc:8443/mlflow"
  experimentName: "multi-agent-orchestrator"
  workspace: ""                     # default: release namespace
  # Prompt Registry: prompts are versioned in MLflow and loaded by alias
  prompts:
    alias: production
    cacheTtlSeconds: 60
    # Move the alias to the version synced from the chart on every helm upgrade.
    # Set false to keep versions promoted from the MLflow UI.
    promoteOnSync: true

# =============================================================================
# Guardrails (NeMo Guardrails via TrustyAI Operator)
# =============================================================================
guardrails:
  enabled: true
  name: multi-agents-guardrails     # NemoGuardrails CR / Service (port 80)
  configId: multi-agents
  replicas: 1
  # Agents: allow the request when NeMo is unreachable (true) or refuse it (false)
  failOpen: true
  # LLM self-check rail on input (jailbreak / off-topic) — adds one LLM call per message
  selfCheckInput: true
  # Presidio PII masking (entities replaced by <ENTITY_TYPE>)
  pii:
    # No PERSON: Presidio's English spaCy model is unreliable on French text in both
    # directions ("Liste les appels d'offres" -> "<PERSON> d'offres", while "Marie Martin"
    # is missed). Structured identifiers are detected reliably (patterns + checksums).
    inputEntities: [EMAIL_ADDRESS, PHONE_NUMBER, IBAN_CODE, CREDIT_CARD, FR_NIR, FR_IBAN, FR_PHONE, FR_PLATE]
    outputEntities: [EMAIL_ADDRESS, PHONE_NUMBER, IBAN_CODE, CREDIT_CARD, FR_NIR, FR_IBAN, FR_PHONE, FR_PLATE]
    scoreThreshold: 0.4
  # GLiNER: the names of people, in French and five other languages, after Presidio (rails
  # "gliner mask pii on input / output"). One CPU pod (guardrails/gliner-server); the model is
  # downloaded from Hugging Face at the first start into a volume.
  gliner:
    enabled: true
    image:
      repository: gliner-server
      tag: v3.5.0
    model: urchade/gliner_multi_pii-v1     # Apache-2.0; en, fr, de, es, it, pt
    entities: [person]                     # GLiNER labels, masked as [PERSON]
    threshold: 0.5
    modelStorage: 3Gi
    resources:
      requests: {cpu: "1", memory: 3Gi}
      limits: {cpu: "2", memory: 4Gi}

# =============================================================================
# MCP Gateway (Red Hat Connectivity Link 1.3 — Tech Preview)
# =============================================================================
mcpGateway:
  # Isolated MCP Gateway instance for this namespace (own Gateway + MCPGatewayExtension);
  # the shared mcp-system gateway is not modified. The mcp-gateway controller (mcp-system)
  # deploys the broker in this namespace.
  # In-cluster federated endpoint (all tools, original names):
  #   http://<gatewayName>-<gatewayClassName>.<namespace>.svc.cluster.local/mcp
  #   (template helper: multi-agents.mcpGateway.url)
  enabled: true

  gatewayName: mcp-gateway
  gatewayClassName: openshift-default   # OCP Gateway API controller (Istio-based)
  listenerHostname: ""  # default: in-cluster Service FQDN <gatewayName>-<gatewayClassName>.<ns>.svc.cluster.local
  listenerPort: 80

  extension:
    name: mcp-extension

  httpRouteManagement: Enabled  # Enabled | Disabled
  backendPingIntervalSeconds: 60

  # One HTTPRoute (internal listener "mcps", host <key>.mcp-<ns>.local) + MCPServerRegistration
  # per server; also requires mcp.<key>.enabled. prefix "" = keep original tool names.
  registrations:
    ocr:
      enabled: true
      prefix: ""
      serviceName: ocr-server
      servicePort: 8080
    rag:
      enabled: true
      prefix: ""
      serviceName: rag-server
      servicePort: 8080
    claims:
      enabled: true
      prefix: ""
      serviceName: claims-server
      servicePort: 8080
    tenders:
      enabled: true
      prefix: ""
      serviceName: tenders-server
      servicePort: 8080
    postal:
      enabled: true
      prefix: ""
      serviceName: postal-server
      servicePort: 8080
    tracking:
      enabled: true
      prefix: ""
      serviceName: tracking-server
      servicePort: 8080
    sandbox:
      enabled: true
      prefix: ""
      serviceName: sandbox-server
      servicePort: 8080

  # Kuadrant AuthPolicy (JWT) on the "mcp" listener — rendered only if enabled AND issuerUrl set
  auth:
    enabled: false
    issuerUrl: ""  # OIDC issuer, e.g. https://keycloak.<clusterDomain>/realms/mcp

  # Kuadrant RateLimitPolicy (kuadrant.io/v1) on the "mcp" listener
  rateLimit:
    enabled: false
    rates:
      - limit: 100
        window: 60s
    counters: []  # CEL, e.g. "auth.identity.sub" (per-user, requires auth.enabled)

# =============================================================================
# A2A Agents (Autonomous domain agents with Agent-to-Agent protocol)
# =============================================================================
agents:
  enabled: true
  maxTokens: 4096
  timeout: 300

  claims:
    enabled: true
    replicas: 1
    image:
      repository: claims-agent
      tag: v3.5.18
    model: ""          # default: models.reasoning
    logLevel: INFO
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 2Gi

  tenders:
    enabled: true
    replicas: 1
    image:
      repository: tenders-agent
      tag: v3.5.18
    model: ""          # default: models.reasoning
    logLevel: INFO
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 2Gi

  postal:
    enabled: true
    replicas: 1
    image:
      repository: postal-agent
      tag: v3.5.18
    model: ""          # default: models.reasoning
    logLevel: INFO
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 2Gi

# =============================================================================
# SPIFFE workload identity (Zero Trust Workload Identity Manager / SPIRE)
# =============================================================================
# Backend -> agents A2A calls carry a JWT-SVID (audience a2a:<agent>) validated by
# each agent against the local SPIRE agent. Requires the ZTWIM operator (CSI driver
# csi.spiffe.io) installed outside openshift-* namespaces.
spiffe:
  enabled: false
  csiDriver: csi.spiffe.io
  # Create a ClusterSPIFFEID for the namespace (otherwise the operator fallback
  # spiffe://<trust-domain>/ns/<ns>/sa/<sa> template applies)
  clusterSPIFFEID:
    create: true
    className: zero-trust-workload-identity-manager-spire

# =============================================================================
# OpenShift AI dashboard — AI hub catalogs (Developer Preview) and observability
# =============================================================================
rhoaiCatalog:
  enabled: true
  # model-catalog (AI hub > Agents / MCP servers) loads the ConfigMaps of this namespace
  # labelled opendatahub.io/catalog-source=true (the catalog pod restarts to reload them)
  namespace: rhoai-model-registries
  # Source links of the entries ("Open repository", "Source code"); empty = no link
  repository:
    url: ""                # e.g. https://github.com/<org>/<repo>
    ref: main              # branch or tag of the links
  provider: MO
  supportedBy: MO supported          # catalog section titles: "<supportedBy> agents / MCP servers"
  # Card badge. The dashboard only displays redHatSupported, partnerSupported, communitySupported
  supportTier: communitySupported
  license:
    id: apache-2.0
    name: Apache License 2.0
    link: https://www.apache.org/licenses/LICENSE-2.0
  agents:
    claims:
      displayName: Claims Processing Agent
      description: Insurance claims — OCR, contracts and precedents (RAG), approve/deny/manual_review decisions, payout in an OpenShell sandbox.
      skills: [process-claim, query-claims]
      tags: [insurance, claims]
    tenders:
      displayName: Tenders Analysis Agent
      description: BTP tenders (appels d'offres) — OCR, references, history and capabilities, Go/No-Go/A approfondir decisions.
      skills: [analyze-tender, query-tenders]
      tags: [btp, tenders]
    postal:
      displayName: Postal Services Agent
      description: Postal complaints (rembourser/reexpedier/rejeter/escalader), parcel tracking and postal information — three profiles.
      skills: [process-complaint, track-parcel, postal-info, query-complaints]
      tags: [postal, complaints, tracking]
  # Gen AI studio agent profiles (AI asset endpoints > Agents, playground): same prompt
  # (MLflow) and MCP tools as the A2A agent profiles. The id names the ConfigMap: keep it stable.
  agentProfiles:
    - id: aff29b12-57c8-4eca-a3ce-5075dd155751
      displayName: Claims Processing Agent
      description: Insurance claims — details, documents (OCR), contracts, precedents, payout computed in the OpenShell sandbox.
      prompt: claims-processing-agent
      mcpServers:
        - {server: claims, tools: [list_claims, get_claim, get_claim_documents, get_claim_statistics, compute_payout]}
        - {server: ocr, tools: [ocr_document]}
        - {server: rag, tools: [retrieve_user_info, retrieve_similar_claims, search_knowledge_base]}
        - {server: sandbox, tools: [run_python]}
    - id: f6f4c3a6-b1ea-46b9-aa14-a808bdefec55
      displayName: Tenders Analysis Agent
      description: BTP tenders — details, documents (OCR), company references, tender history and capabilities.
      prompt: ao-processing-agent
      mcpServers:
        - {server: tenders, tools: [list_tenders, get_tender, get_tender_documents, get_tender_statistics]}
        - {server: ocr, tools: [ocr_document]}
        - {server: rag, tools: [retrieve_similar_references, retrieve_historical_tenders, retrieve_capabilities, search_knowledge_base]}
    - id: 0dcc383d-a5d3-4aa0-9050-0137c9531d0e
      displayName: Postal Complaints Agent
      description: Postal complaints — details, documents, tracking history and similar complaints.
      prompt: courrier-reclamation-instructions
      mcpServers:
        - {server: postal, tools: [list_reclamations, get_reclamation, get_reclamation_documents, get_reclamation_statistics]}
        - {server: tracking, tools: [get_tracking]}
        - {server: rag, tools: [search_courrier_knowledge, retrieve_similar_reclamations]}
        - {server: ocr, tools: [ocr_document]}
    - id: 7416e9b2-2ab2-4753-ab20-237ffabff78e
      displayName: Parcel Tracking Agent
