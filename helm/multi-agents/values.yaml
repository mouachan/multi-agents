  # Tools, descriptions and parameters: files/catalog/mcp-tools.yaml; READMEs: files/catalog/mcp/<name>.md
  mcpServers:
    ocr:
      displayName: Document OCR
      description: Text extraction from PDF and image documents with the vision model.
      source: backend/mcp_servers/ocr_server
      tags: [ocr, documents, vision]
    rag:
      displayName: Knowledge & similarity search
      description: pgvector retrieval — user contracts, similar claims/tenders/complaints, references, capabilities, knowledge bases.
      source: backend/mcp_servers/rag_server
      tags: [rag, pgvector, similarity, knowledge-base]
    claims:
      displayName: Claims records
      description: Insurance claims — list, details, documents, statistics, payout computed in the OpenShell sandbox, save decisions.
      source: backend/mcp_servers/claims_server
      tags: [insurance, claims]
    tenders:
      displayName: Tenders records
      description: BTP tenders — list, details, documents, statistics, save decisions.
      source: backend/mcp_servers/tenders_server
      tags: [btp, tenders]
    postal:
      displayName: Postal complaints records
      description: Postal complaints — list, details, documents, statistics, save decisions.
      source: backend/mcp_servers/postal_server
      tags: [postal, complaints]
    tracking:
      displayName: Parcel tracking
      description: Parcel and mail tracking timelines.
      source: backend/mcp_servers/tracking_server
      tags: [postal, tracking]
    sandbox:
      displayName: Sandboxed code interpreter
      description: run_python executes LLM-generated Python in an OpenShell sandbox (no network, Landlock).
      source: backend/mcp_servers/sandbox_exec_server
      tags: [sandbox, openshell, code-execution]
  # Gen AI Studio playground MCP list (ConfigMap gen-ai-aa-mcp-servers in the RHOAI apps namespace)
  playground:
    enabled: true
    namespace: redhat-ods-applications

observability:
  enabled: true
  # RHOAI monitoring stack (DSCI monitoring): Perses dashboards live next to their datasources
  monitoringNamespace: redhat-ods-monitoring
