---
# Local development stack (podman compose) — same architecture as RHOAI 3.5:
#   frontend → backend → A2A agents (claims, tenders, postal) → OGX Responses API → MCP servers
#
# Models are served by the external MaaS configured in .env (git-ignored):
#   MAAS_BASE_URL, MAAS_API_KEY, MAAS_REASONING_MODEL, MAAS_VISION_MODEL,
#   MAAS_EMBEDDING_MODEL, MAAS_EMBEDDING_DIMENSION
# The OGX image is pulled from registry.redhat.io (podman login registry.redhat.io).
# Cluster-only features are disabled here: NeMo Guardrails, SPIFFE, MCP Gateway.
#
#   podman compose up -d --build

x-postgres-env: &postgres-env
  POSTGRES_HOST: postgresql
  POSTGRES_PORT: 5432
  POSTGRES_DATABASE: multi_agent_db
  POSTGRES_USER: multi_agent_user
  POSTGRES_PASSWORD: multi_agents_pass

# OGX 1.2 model identifiers are "<provider_id>/<model_id>" (provider "maas" in ogx/config.yaml)
x-ogx-env: &ogx-env
  OGX_ENDPOINT: http://ogx:8321
  OGX_DEFAULT_MODEL: maas/${MAAS_REASONING_MODEL:-llama-scout-17b}
  OGX_EMBEDDING_MODEL: maas/${MAAS_EMBEDDING_MODEL:-nomic-embed-text-v1-5}
  OGX_EMBEDDING_DIMENSION: ${MAAS_EMBEDDING_DIMENSION:-768}
  OGX_TIMEOUT: 300

x-mcp-env: &mcp-env
  <<: [*postgres-env, *ogx-env]
  HOST: 0.0.0.0
  PORT: 8080
  LOG_LEVEL: INFO

x-agent-env: &agent-env
  AGENT_PORT: 8090
  OGX_ENDPOINT: http://ogx:8321
  OGX_DEFAULT_MODEL: maas/${MAAS_REASONING_MODEL:-llama-scout-17b}
  OGX_MAX_TOKENS: 4096
  OGX_TIMEOUT: 300
  MCP_SERVER_URL_TEMPLATE: http://{server}:8080/mcp
  MLFLOW_TRACKING_URI: http://mlflow:5000
  PROMPT_ALIAS: production
  PROMPT_CACHE_TTL: 60
  PROMPTS_DIRS: /opt/app-root/prompts/claims:/opt/app-root/prompts/ao:/opt/app-root/prompts/courrier:/opt/app-root/prompts/orchestrator
  LOG_LEVEL: INFO

x-prompt-volumes: &prompt-volumes
  - ./helm/multi-agents/files/cm.claims-prompts:/opt/app-root/prompts/claims:ro
  - ./helm/multi-agents/files/cm.ao-prompts:/opt/app-root/prompts/ao:ro
  - ./helm/multi-agents/files/cm.courrier-prompts:/opt/app-root/prompts/courrier:ro
  - ./helm/multi-agents/files/cm.orchestrator-prompts:/opt/app-root/prompts/orchestrator:ro

services:
  # PostgreSQL with pgvector (application database + OGX database "ogx", created by the ogx service)
  postgresql:
    image: pgvector/pgvector:pg16
    container_name: multi-agents-postgres
    environment:
      POSTGRES_DB: multi_agent_db
      POSTGRES_USER: multi_agent_user
      POSTGRES_PASSWORD: multi_agents_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/seed_data/001_seed_data.sql:/docker-entrypoint-initdb.d/02-seed-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multi_agent_user -d multi_agent_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - multi-agents-network

  # OGX (formerly LlamaStack) — Responses API, MCP tool routing, pgvector, Files API
  ogx:
    image: registry.redhat.io/rhoai/odh-ogx-core-rhel9:v3.5.1
    container_name: multi-agents-ogx
    environment:
      RUN_CONFIG_PATH: /etc/ogx/config.yaml
      MAAS_BASE_URL: ${MAAS_BASE_URL:?set MAAS_BASE_URL in .env}
      MAAS_API_KEY: ${MAAS_API_KEY:?set MAAS_API_KEY in .env}
      MAAS_REASONING_MODEL: ${MAAS_REASONING_MODEL:-llama-scout-17b}
      MAAS_VISION_MODEL: ${MAAS_VISION_MODEL:-llama-scout-17b}
      MAAS_EMBEDDING_MODEL: ${MAAS_EMBEDDING_MODEL:-nomic-embed-text-v1-5}
      MAAS_EMBEDDING_DIMENSION: ${MAAS_EMBEDDING_DIMENSION:-768}
      POSTGRES_HOST: postgresql
      POSTGRES_PORT: 5432
      POSTGRES_DB: ogx
      POSTGRES_USER: multi_agent_user
      POSTGRES_PASSWORD: multi_agents_pass
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-change-me}
    ports:
      - "8321:8321"
    # Create the "ogx" database if missing, then run the image entrypoint
    entrypoint: ["/bin/sh", "-c", "python /etc/ogx/ensure-db.py && exec /opt/app-root/entrypoint.sh"]
    volumes:
      - ./ogx/config.yaml:/etc/ogx/config.yaml:ro
      - ./ogx/ensure-db.py:/etc/ogx/ensure-db.py:ro
    depends_on:
      postgresql:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8321/v1/health')\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - multi-agents-network

  # Backend FastAPI (orchestrator + A2A client)
  backend:
    build:
      context: ./backend
      dockerfile: Containerfile
    container_name: multi-agents-backend
    environment:
      <<: [*postgres-env, *ogx-env]
      DEBUG: "true"
      ENVIRONMENT: development
      OGX_STREAMING_MODEL: maas/${MAAS_REASONING_MODEL:-llama-scout-17b}
      OGX_MAX_TOKENS: 4096
      OCR_SERVER_URL: http://ocr-server:8080
      RAG_SERVER_URL: http://rag-server:8080
      CLAIMS_SERVER_URL: http://claims-server:8080
      TENDERS_SERVER_URL: http://tenders-server:8080
      POSTAL_SERVER_URL: http://postal-server:8080
      TRACKING_SERVER_URL: http://tracking-server:8080
      CLAIMS_AGENT_A2A_URL: http://claims-agent:8090
      TENDERS_AGENT_A2A_URL: http://tenders-agent:8090
      POSTAL_AGENT_A2A_URL: http://postal-agent:8090
      # NeMo Guardrails is cluster-only: empty URL = checks skipped
      GUARDRAILS_SERVER_URL: ""
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-admin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-change-me}
      S3_BUCKET_CLAIMS: claims
      S3_BUCKET_TENDERS: tenders
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: multi-agent-orchestrator
    ports:
      - "8000:8000"
    depends_on:
      postgresql:
        condition: service_healthy
      ogx:
        condition: service_healthy
      minio:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    volumes:
      - ./backend/app:/opt/app-root/src/app
      - ./documents:/documents
    networks:
      - multi-agents-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # A2A domain agents (a2a-sdk, JSON-RPC + SSE streaming on port 8090)
  claims-agent:
    build:
      context: .
      dockerfile: agents/Containerfile
      args:
        AGENT: claims-agent
    container_name: multi-agents-claims-agent
    environment:
      <<: *agent-env
      AGENT_ID: claims
      AGENT_PUBLIC_URL: http://claims-agent:8090
      MLFLOW_EXPERIMENT_NAME: multi-agent-orchestrator-claims-agent
    ports:
      - "8091:8090"
    volumes: *prompt-volumes
    depends_on:
      ogx:
        condition: service_healthy
    networks:
      - multi-agents-network

  tenders-agent:
    build:
      context: .
      dockerfile: agents/Containerfile
      args:
        AGENT: tenders-agent
    container_name: multi-agents-tenders-agent
    environment:
      <<: *agent-env
      AGENT_ID: tenders
      AGENT_PUBLIC_URL: http://tenders-agent:8090
      MLFLOW_EXPERIMENT_NAME: multi-agent-orchestrator-tenders-agent
    ports:
      - "8092:8090"
    volumes: *prompt-volumes
    depends_on:
      ogx:
        condition: service_healthy
    networks:
      - multi-agents-network

  postal-agent:
    build:
      context: .
      dockerfile: agents/Containerfile
      args:
        AGENT: postal-agent
    container_name: multi-agents-postal-agent
    environment:
      <<: *agent-env
      AGENT_ID: postal
      AGENT_PUBLIC_URL: http://postal-agent:8090
      MLFLOW_EXPERIMENT_NAME: multi-agent-orchestrator-postal-agent
    ports:
      - "8093:8090"
    volumes: *prompt-volumes
    depends_on:
      ogx:
        condition: service_healthy
    networks:
      - multi-agents-network

  # Versions the agent prompts in the MLflow Prompt Registry (alias @production).
  # Agents fall back to the mounted prompt files until the alias exists.
  prompt-sync:
    build:
      context: .
      dockerfile: agents/Containerfile
      args:
        AGENT: claims-agent
    container_name: multi-agents-prompt-sync
    command: ["python", "-m", "shared.prompt_sync"]
    environment:
      AGENT_ID: prompt-sync
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: prompt-sync
      PROMPT_ALIAS: production
      PROMPT_PROMOTE: "true"
      HELM_RELEASE_REVISION: local
      PROMPTS_DIRS: /opt/app-root/prompts/claims:/opt/app-root/prompts/ao:/opt/app-root/prompts/courrier:/opt/app-root/prompts/orchestrator
    volumes: *prompt-volumes
    depends_on:
      mlflow:
        condition: service_healthy
    networks:
      - multi-agents-network

  # MCP servers (streamable HTTP on /mcp, port 8080)
  ocr-server:
    build:
      context: ./backend/mcp_servers/ocr_server
      dockerfile: Containerfile
    container_name: multi-agents-ocr-server
    environment:
      <<: *mcp-env
      OGX_VISION_MODEL: maas/${MAAS_VISION_MODEL:-llama-scout-17b}
    ports:
      - "8081:8080"
    volumes:
      - ./documents:/documents:ro
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - multi-agents-network

  rag-server:
    build:
      context: ./backend/mcp_servers
      dockerfile: rag_server/Containerfile
    container_name: multi-agents-rag-server
    environment: *mcp-env
    ports:
      - "8082:8080"
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - multi-agents-network

  claims-server:
    build:
      context: ./backend/mcp_servers
      dockerfile: claims_server/Containerfile
    container_name: multi-agents-claims-server
    environment: *mcp-env
    ports:
      - "8083:8080"
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - multi-agents-network

  tenders-server:
    build:
      context: ./backend/mcp_servers
      dockerfile: tenders_server/Containerfile
    container_name: multi-agents-tenders-server
    environment: *mcp-env
    ports:
      - "8084:8080"
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - multi-agents-network

  postal-server:
    build:
      context: ./backend/mcp_servers
      dockerfile: postal_server/Containerfile
    container_name: multi-agents-postal-server
    environment: *mcp-env
    ports:
      - "8085:8080"
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - multi-agents-network

  tracking-server:
    build:
      context: ./backend/mcp_servers
      dockerfile: tracking_server/Containerfile
    container_name: multi-agents-tracking-server
    environment: *mcp-env
    ports:
      - "8086:8080"
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - multi-agents-network

  # MinIO (S3-compatible object storage: claim documents + OGX Files API)
  minio:
    # Chainguard rebuild (MinIO community images are no longer published)
    image: cgr.dev/chainguard/minio:latest-dev@sha256:12706237289ea1df7cf41e84af3251ada57a036838c9b62e7c9a8a76d0092ba5
    container_name: multi-agents-minio
    command: server /data --console-address ":9001"
    user: "0"  # the minio_data volume may hold files written as root by older images
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - multi-agents-network

  # Data initialization: local PDFs (./documents) → OGX Files API, then 10+10 via MCP tools
  data-init:
    build:
      context: ./backend/scripts
      dockerfile: Containerfile
    container_name: multi-agents-data-init
    depends_on:
      ogx:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      ocr-server:
        condition: service_started
      claims-server:
        condition: service_started
      tenders-server:
        condition: service_started
      postal-server:
        condition: service_started
      tracking-server:
        condition: service_started
    environment:
      <<: *postgres-env
      OGX_ENDPOINT: http://ogx:8321
      EMBEDDING_MODEL: maas/${MAAS_EMBEDDING_MODEL:-nomic-embed-text-v1-5}
      FORCE_REINIT: ${FORCE_REINIT:-false}
      OCR_SERVER_URL: http://ocr-server:8080
      CLAIMS_SERVER_URL: http://claims-server:8080
      TENDERS_SERVER_URL: http://tenders-server:8080
      POSTAL_SERVER_URL: http://postal-server:8080
      TRACKING_SERVER_URL: http://tracking-server:8080
    volumes:
      - ./documents:/documents:ro
    networks:
      - multi-agents-network

  # Frontend React (dev mode)
  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile.dev
    container_name: multi-agents-frontend
    ports:
      - "3000:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/package.json:/app/package.json:ro
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json:ro
      - ./frontend/tailwind.config.js:/app/tailwind.config.js:ro
      - ./frontend/postcss.config.js:/app/postcss.config.js:ro
    networks:
      - multi-agents-network
    depends_on:
      - backend

  # MLflow 3.14 (same minor as RHOAI 3.5): tracing (OTLP /v1/traces) + Prompt Registry.
  # An existing MLflow 2.x database is upgraded in place on start.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.14.0
    container_name: multi-agents-mlflow
    ports:
      - "5001:5000"
    volumes:
      - mlflow_data:/mlflow
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -f /mlflow/mlflow.db ]; then mlflow db upgrade sqlite:////mlflow/mlflow.db; fi
        exec mlflow server --host 0.0.0.0 --port 5000 \
          --backend-store-uri sqlite:////mlflow/mlflow.db \
          --artifacts-destination /mlflow/artifacts \
          --allowed-hosts "mlflow,mlflow:5000,localhost,localhost:5000,localhost:5001,127.0.0.1:5000,127.0.0.1:5001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 15s
    networks:
      - multi-agents-network

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  mlflow_data:
    driver: local

networks:
  multi-agents-network:
    driver: bridge
