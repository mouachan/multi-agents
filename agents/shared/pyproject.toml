[project]
name = "agent-shared"
version = "3.5.0"
description = "Shared library for A2A domain agents"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk[http-server]>=1.2.2,<2.0.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "mlflow-skinny>=3.14,<3.15",
    "opentelemetry-sdk>=1.33",
    "opentelemetry-exporter-otlp-proto-http>=1.33",
]>=1.1.0",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "uvicorn>=0.30",
    "mlflow>=2.15",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
